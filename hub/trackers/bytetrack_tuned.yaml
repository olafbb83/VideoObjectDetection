# ByteTrack, підібраний під нашу камеру на записі docs/track_test.mp4.
# Метод і числа — docs/benchmarks.md, розділ «Етап 5».
#
# Базова конфігурація ultralytics на цьому записі давала 18 ID і медіану
# тривалості треку 0.7 с. Ця — 6 ID і 3.9 с при втраті 2% покриття.
# Теоретичний мінімум для запису ≈ 5-6 ID: людина чотири рази виходить
# з кадру, і кожне повернення законно створює новий трек (ByteTrack
# зіставляє за геометрією й рухом, зовнішність він не пам'ятає).

tracker_type: bytetrack

track_high_thresh: 0.25 # перший прохід зіставлення
track_low_thresh: 0.1 # другий прохід: порятунок треків слабкими детекціями

# 0.5 замість 0.25. Новий трек заводиться тільки на впевненій детекції —
# інакше кожен шумний бокс на пересвіченому фоні породжував новий ID.
new_track_thresh: 0.5

# 30 кадрів (типове значення). Збільшення до 60 і 90 не дало НІЧОГО:
# буфер лише довше зберігає втрачений трек, а щоб оживити його, потрібен
# збіг по IoU. Коли людина відходить і повертається в іншу точку кадру,
# перекриття нульове — трек не оживає, скільки його не тримай.
track_buffer: 30

# 0.9 замість 0.8 — найдієвіший параметр. Це поріг ВАРТОСТІ зіставлення:
# більше значення = трекер приймає гірший збіг замість того, щоб заводити
# новий ID. Сам по собі дав 12 ID замість 18.
match_thresh: 0.9

fuse_score: True
