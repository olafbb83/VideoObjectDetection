; Freenove ESP32-S3-WROOM CAM — MJPEG-стрімер для проекту VideoDetection
;
; Плата не має власного board-файлу в PlatformIO, тому беремо генеричний
; esp32-s3-devkitc-1 і вручну описуємо пам'ять модуля ESP32-S3-WROOM-1 N8R8:
; 8 МБ flash (QIO) + 8 МБ PSRAM (OPI = octal). Якщо в тебе ревізія з іншою
; пам'яттю — прошивка надрукує реальні значення в лог при старті, звірся з ними.

[env:freenove_s3_cam]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Плата має два USB-C: "UART" (міст CH343, VID:PID 1A86:55D3) і нативний USB.
; Фіксуємо порт явно, бо в системі є ще Bluetooth-порти COM12/COM13,
; на які автовизначення може помилково вказати. Змінити, якщо порт інший.
upload_port  = COM3
monitor_port = COM3

; --- пам'ять модуля ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 8MB
; esp_camera + WiFi + HTTP-сервер не влазять у дефолтний 1.3 МБ розділ
board_build.partitions          = huge_app.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

; lib_deps для esp32-camera НЕ потрібен: Arduino-core для ESP32 уже містить
; цей драйвер у своєму SDK (tools/sdk/esp32s3/include/esp32-camera).
; Якщо додати його ще й через lib_deps — ризикуємо зібрати дві різні версії
; драйвера в одному образі.
